services:
  postgres:
    image: postgres:16-alpine
    container_name: barberia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberia
      POSTGRES_PASSWORD: barberia_dev_password
      POSTGRES_DB: barberia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
